name: Publish package

on:
  push:
    tags: ["resilient-rpc-v*", "message-broker-v*"]
  workflow_dispatch:
    inputs:
      package:
        description: "Package directory to publish"
        required: true
        type: choice
        options: [resilient-rpc, message-broker]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # tag "message-broker-v1.0.0" -> "message-broker"; manual runs use the input
      PACKAGE: ${{ inputs.package || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Resolve package directory
        run: |
          if [ -z "$PACKAGE" ]; then
            PACKAGE="${GITHUB_REF_NAME%-v*}"
          fi
          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: ${{ env.PACKAGE }}
      - run: npm test
        working-directory: ${{ env.PACKAGE }}
      - run: npm publish --provenance
        working-directory: ${{ env.PACKAGE }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
